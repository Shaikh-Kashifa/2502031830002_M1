<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f4f5f7;
      }

      .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 60px;
        padding: 50px 8%;
        background: #f4f5f7;
      }

      .auth-image {
        flex: 1;
      }

      .auth-image img {
        width: 100%;
        height: 750px;
        object-fit: cover;
        border-radius: 25px;
      }

      .auth-form {
        flex: 1;
        max-width: 700px;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .auth-form h2 {
        font-size: 30px;
        margin-bottom: 8px;
        text-align: center;
      }

      .auth-form p {
        color: #777;
        margin-bottom: 25px;
        text-align: center;
      }

      .auth-form input {
        width: 100%;
        padding: 12px 18px;
        margin-bottom: 12px;
        border: 1px solid #ddd;
        border-radius: 50px;
        outline: none;
        font-size: 15px;
      }

      .auth-form input:focus {
        border-color: #204153;
        box-shadow: 0 0 8px rgba(32, 65, 83, 0.2);
      }

      .auth-form button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 50px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(to right, #44565e, #204153);
        margin-top: 5px;
      }

      .auth-form button:hover {
        transform: translateY(-3px);
        background: #f57c42;
      }

      .bottom-text {
        margin-top: 20px;
        text-align: center;
      }

      .bottom-text a {
        color: #f57c42;
        text-decoration: none;
        font-weight: 600;
      }

      .bottom-text a:hover {
        text-decoration: underline;
      }

      @media (max-width: 992px) {
        .auth-container {
          flex-direction: column;
        }

        .auth-image {
          display: none;
        }

        .auth-form {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <section class="auth-container">
      <div class="auth-image">
        <img
          src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1000&q=80"
          alt="Fashion"
        />
      </div>

      <div class="auth-form">
        <h2>Create Account</h2>
        <p>Join Reid and start your shopping journey</p>

        <form action="login.html">
          <input type="text" placeholder="First Name" required />

          <input type="text" placeholder="Last Name" required />

          <input type="email" placeholder="Email Address" required />

          <input type="tel" placeholder="Phone Number" required />

          <input type="password" placeholder="Password" required />

          <button type="submit">Create Account</button>

          <p class="bottom-text">
            Already have an account?
            <a href="login.html">Login</a>
          </p>
        </form>
      </div>
    </section>
  </body>
</html>
