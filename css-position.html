<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>

    <style>
        body{
            height: 1000px;
        }
        
        .div1{
            position: absolute;
            left: 50px;
            top: 20px;
            border: 2px solid black;
            height: 100px;
            width: 200px;
            background-color: rgb(145, 39, 39);
            padding: 10px;
        }

        .div2{
            position: absolute;
            left: 50px;
            top: 100px;
            border: 2px solid black;
            height: 100px;
            width: 200px;
            background-color: rgb(199, 119, 119);
            padding: 10px;
        }
        
        .div3{
            position: fixed;
            left: 50px;
            top: 150px;
            border: 2px solid black;
            height: 100px;
            width: 200px;
            background-color: rgb(93, 147, 163);
            padding: 10px;
        }

    </style>
</head>

<body>

    

    <div class="div1">This is example of css position - absolute</div>

    <div class="div2">This is example of css position - relative</div>

    <div class="div3">This is example of css position - fixed</div>

</body>
</html>
