<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String method</title>
</head>
<body>
    <script>

        var str = " Hello JavaScript ";

        // charAt()
        document.write("charAt: " + str.charAt(1) + "<br><br>");

        // concat()
        document.write("concat: " + str.concat(" World") + "<br><br>");

        // indexOf()
        document.write("indexOf: " + str.indexOf("Java") + "<br><br>");

        // lastIndexOf()
        document.write("lastIndexOf: " + str.lastIndexOf("a") + "<br><br>");

        // search()
        document.write("search: " + str.search("Java") + "<br><br>");

        // match()
        document.write("match: " + str.match("Java") + "<br><br>");

        // replace()
        document.write("replace: " + str.replace("JavaScript","JS") + "<br><br>");

        // substr()
        document.write("substr: " + str.substr(7,4) + "<br><br>");

        // substring()
        document.write("substring: " + str.substring(7,11) + "<br><br>");

        // slice()
        document.write("slice: " + str.slice(7,11) + "<br><br>");

        // toLowerCase()
        document.write("toLowerCase: " + str.toLowerCase() + "<br><br>");

        // toUpperCase()
        document.write("toUpperCase: " + str.toUpperCase() + "<br><br>");

        // toString()
        document.write("toString: " + str.toString() + "<br><br>");

        // valueOf()
        document.write("valueOf: " + str.valueOf() + "<br><br>");

        // split()
        document.write("split: " + str.split(" ") + "<br><br>");

        // trim()
        document.write("trim: " + str.trim() + "<br><br>");

    </script>
    
</body>
</html>
