<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - HappyShop</title>
    <link rel="stylesheet" href="home.css">

    <style>

        .contact-section{
            padding:150px 8% 100px;
        }

        .contact-box{
            max-width:700px;
            margin:auto;
            background:rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter:blur(15px);
            padding:40px;
            border-radius:30px;
        }

        .contact-box h2{
            text-align:center;
            font-size:45px;
            margin-bottom:30px;
        }

        .input-box{
            margin-bottom:25px;
        }

        .input-box input,
        .input-box textarea{

            width:100%;
            padding:15px;
            border:none;
            outline:none;
            border-radius:15px;
            background:#2b384d;
            color:white;
            font-size:16px;
        }

        .input-box textarea{
            resize:none;
            height:150px;
        }

        .contact-btn{
            width:100%;
            padding:15px;
            border:none;
            border-radius:40px;
            font-size:18px;
            cursor:pointer;
            color:white;
            background:linear-gradient(to right,#38bdf8,#ec4899);
            transition:0.4s;
        }

        .contact-btn:hover{
            transform:scale(1.03);
        }

    </style>

</head>

<body>

    <!-- Navigation -->

    <nav>

        <div class="logo">HappyShop</div>

        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>

    <!-- Contact Form -->

    <section class="contact-section">

        <div class="contact-box">

            <h2>Contact Us</h2>

            <form>

                <div class="input-box">
                    <input type="text" placeholder="Enter Your Name">
                </div>

                <div class="input-box">
                    <input type="email" placeholder="Enter Your Email">
                </div>

                <div class="input-box">
                    <textarea placeholder="Enter Your Message"></textarea>
                </div>

                <button class="contact-btn">Send Message</button>

            </form>

        </div>

    </section>

    <!-- Footer -->

    <footer>

        <p>&copy; 2026 HappyShop | Designed By Kashifa</p>

    </footer>

</body>
</html>
