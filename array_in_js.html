<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array and its Methods</title>
</head>
<body>
    <script>
        
        var car = new Array(3);
        car[0] = "Ford";
        car[1] = "Toyota";
        car[2] = "Honda";

        var Car2=new Array ("Ford","Toyota","Honda");
        var Car3=["Audi","Innova","Vagon"];

        document.write(Car2 + "<br>");

        // <!-- Array Methods -->

        // push() 
        Car2.push("Yamaha");
        document.write(Car2 + "<br>");

        //pop()
        Car2.pop();
        document.write(Car2 + "<br>");

        //concat()
        var data= Car2.concat(Car3);
        document.write(data + "<br>");


    </script>
</body>
</html>
