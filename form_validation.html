<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <form name="RegForm" method="post" id="RegForm" onsubmit="return validate()">

        <table>

            <tr>
                <td colspan="2">
                    <h1 style="text-align:center;">REGISTRATION FORM</h1>
                </td>
            </tr>

            <tr>
                <td>Name :</td>
                <td>
                    <input type="text" size="40" name="Name">
                </td>
            </tr>

            <tr>
                <td>E-mail Address:</td>
                <td>
                    <input type="text" size="40" name="EMail">
                </td>
            </tr>

            <tr>
                <td>Password:</td>
                <td>
                    <input type="password" size="40" name="Password">
                </td>
            </tr>

            <tr>
                <td>Mobile:</td>
                <td>
                    <input type="text" size="40" name="Telephone">
                </td>
            </tr>

            <tr>
                <td>Select Your Course :</td>

                <td>
                    <select name="Course">
                        <option value="">Select Course</option>
                        <option>B.Tech</option>
                        <option>M.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Comments:</td>

                <td>
                    <textarea cols="40" name="Comments"></textarea>
                </td>
            </tr>

            <tr>
                <td></td>

                <td>
                    <input type="submit" value="Submit" name="Submit">

                    <input type="reset" value="Reset" name="Reset">
                </td>
            </tr>

        </table>
    </form>

    <script>

        function validate()
        {
            var form1 = document.getElementById("RegForm");

            var name = form1.Name.value;
            var email = form1.EMail.value;
            var mobile = form1.Telephone.value;
            var course = form1.Course.value;
            var password = form1.Password.value;

            var regEmail = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;

            var regPhone = /^\d{10}$/;

            if(name == "")
            {
                alert("Please Enter Your Name");
                return false;
            }

            else if(email == "" || !regEmail.test(email))
            {
                alert("Please Enter Valid Email");
                return false;
            }

            else if(password == "")
            {
                alert("Please Enter Password");
                return false;
            }

            else if(password.length < 6)
            {
                alert("Password must be at least 6 characters");
                return false;
            }

            else if(mobile == "" || !regPhone.test(mobile))
            {
                alert("Please Enter Valid Mobile Number");
                return false;
            }

            else if(course == "")
            {
                alert("Please Select Course");
                return false;
            }

            else
            {
                alert("Form Submitted Successfully");
                return true;
            }
        }

    </script>

</body>
</html>
