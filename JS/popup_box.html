<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popup Boxes</title>
  </head>
  <body>
    <!-- Alert Box -->
    <script>
      alert("Hello, World!");
    </script>

    <!-- Confirm Box -->
    <script>
      confirm("Are you sure?");
    </script>

    <!-- Prompt Box -->
    <script>
      var a = prompt("Enter your name:");
      alert("User entered: " + a);
    </script>
  </body>
</html>
