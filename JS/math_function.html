<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // Display Euler's number
      document.writeln(Math.E + "<br>");

      // Calculate 2 to the power of 3
      var a = Math.pow(2, 3);
      document.writeln(a + "<br>");

      // Generate a random number between 0 and 1
      var num = Math.random();
      document.writeln(num + "<br>");

      // Generate a random integer between 1 and 100
      var num2 = parseInt(1 + Math.random() * 100);
      document.writeln(num2 + "<br>");

      // Calculate the square root of 16
      document.writeln(Math.sqrt(16) + "<br>");

      // Calculate the ceiling of 2.7
      document.writeln(Math.ceil(2.7) + "<br>");

      // Calculate the floor of 2.7
      document.writeln(Math.floor(2.7) + "<br>");

      // Calculate the round of 2.7
      document.writeln(Math.round(2.7) + "<br>");
    </script>
  </body>
</html>
