<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Validation using RegExp</title>
  </head>
  <body>
    <input type="email" id="myText" placeholder="Enter your email" />
    <button onclick="checkMail()">Check Email</button>

    <script>
      function checkMail() {
        var a = document.getElementById("myText").value;
        var pattern = "^[\\w-_\.]*[\\w-_\.]\@[\\w]\.+[\\w]+[\\w]$";
        var regex = new RegExp(pattern);

        if (regex.test(a)) {
          alert("valid");
        } else {
          alert("Invalid");
        }
      }
    </script>
  </body>
</html>
