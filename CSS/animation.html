<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Box</title>

    <style>
      body {
        background-color: lightblue;
      }
      .road {
        width: 100%;
        height: 400px;
        background-color: gray;
        position: fixed;
        top: 28%;
        left: 0px;
        border-top: 5px solid white;
        border-bottom: 5px solid white;
        margin: 0px;
      }
      .line {
        width: 100%;
        height: 5px;
        position: absolute;
        top: 50%;
        background: repeating-linear-gradient(
          to right,
          white 0px,
          white 50px,
          transparent 50px,
          transparent 100px
        );
      }
      .car1 {
        width: 200px;
        height: 100px;
        background-color: slateblue;
        border-radius: 10px;
        position: absolute;
        top: 33%;
        animation: move1 5s infinite linear;
        border: 1px solid white;
      }

      .car2 {
        width: 200px;
        height: 100px;
        background-color: lightcoral;
        border-radius: 10px;
        position: absolute;
        top: 57%;
        animation: move2 4s infinite linear;
        border: 1px solid white;
      }

      @keyframes move1 {
        from {
          left: -120px;
        }
        to {
          left: 100%;
        }
      }
      @keyframes move2 {
        from {
          left: -120px;
        }
        to {
          left: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="road"></div>
    <div class="line"></div>
    <div class="car1"></div>
    <div class="car2"></div>
  </body>
</html>
