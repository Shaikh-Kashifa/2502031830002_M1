<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        width: 100%;
      }
      .row1,
      .row3 {
        background-color: gray;
        width: 100%;
        text-align: center;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .row2 {
        width: 100%;
        text-align: center;
        height: 300px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .column1 {
        background-color: gray;
        width: 70%;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }

      .column2 {
        width: 30%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 5px;
      }

      .r1,
      .r2,
      .r3 {
        background-color: gray;
        width: 100%;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 33.33%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row1">Code Planning</div>

      <div class="row2">
        <div class="column1">Content</div>
        <div class="column2">
          <div class="r1">HTML</div>
          <div class="r2">CSS</div>
          <div class="r3">JavaScript</div>
        </div>
      </div>

      <div class="row3">Footer</div>
    </div>
  </body>
</html>
