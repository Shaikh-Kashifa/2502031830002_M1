<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
  </head>

  <body>
    <form align="center">
      <table
        border="1"
        align="center"
        cellpadding="5"
        bgcolor="lightgreen"
        width="40%"
      >
        <tr>
          <th colspan="2">
            <h2>Registration Form</h2>
          </th>
        </tr>

        <tr>
          <td>First Name :</td>
          <td align="left">
            <input type="text" placeholder="Enter First Name" required />
          </td>
        </tr>

        <tr>
          <td>Last Name :</td>
          <td align="left">
            <input type="text" placeholder="Enter Last Name" required />
          </td>
        </tr>

        <tr>
          <td>Contact No :</td>
          <td align="left">
            <input type="tel" placeholder="Enter Contact Number" required />
          </td>
        </tr>

        <tr>
          <td>Email :</td>
          <td align="left">
            <input type="email" placeholder="Enter Email ID" required />
          </td>
        </tr>

        <tr>
          <td>Password :</td>
          <td align="left">
            <input type="password" placeholder="Enter Password" required />
          </td>
        </tr>

        <tr>
          <td>Date of Birth :</td>
          <td align="left">
            <input type="date" required />
          </td>
        </tr>

        <tr>
          <td>Age :</td>
          <td align="left">
            <input type="number" placeholder="Enter Age" />
          </td>
        </tr>

        <tr>
          <td>Gender :</td>
          <td align="left">
            <input type="radio" name="gender" /> Male
            <input type="radio" name="gender" /> Female
          </td>
        </tr>

        <tr>
          <td>Address :</td>
          <td align="left">
            <textarea rows="4" cols="65"></textarea>
          </td>
        </tr>

        <tr>
          <td>City :</td>
          <td align="left">
            <select>
              <option>Select City</option>
              <option>Ahmedabad</option>
              <option>Surat</option>
              <option>Rajkot</option>
            </select>
          </td>
        </tr>

        <tr>
          <td>Pincode :</td>
          <td align="left">
            <input type="text" placeholder="Enter Pincode" />
          </td>
        </tr>

        <tr>
          <td>Joining Date :</td>
          <td align="left">
            <input type="date" />
          </td>
        </tr>

        <tr>
          <td>Confirm Your Form :</td>
          <td align="left">
            <input type="submit" value="Submit" />
            <input type="reset" value="Reset" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
